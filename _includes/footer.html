<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-copy">
      {{ site.title }}
      {%- if site.author %} · {{ site.author }}{% endif %}
    </span>
    <nav class="footer-links" aria-label="Footer navigation">
      {%- if site.social.github -%}
      <a href="https://github.com/{{ site.social.github }}"
         target="_blank" rel="noopener noreferrer">github</a>
      {%- endif -%}
      {%- if site.social.linkedin -%}
      <a href="{{ site.social.linkedin }}"
         target="_blank" rel="noopener noreferrer">linkedin</a>
      {%- endif -%}
      <a href="{{ '/feed.xml' | prepend: site.baseurl }}">rss</a>
      <a href="https://github.com/basicinfosecurity/basicinfosecurity.github.io"
         target="_blank" rel="noopener noreferrer">source</a>
    </nav>
  </div>
</footer>

<script src="{{ '/assets/js/theme.js' | prepend: site.baseurl }}"></script>
