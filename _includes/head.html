<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

{% seo %}
{% feed_meta %}

<link rel="icon" href="{{ '/assets/img/favicon.ico' | prepend: site.baseurl }}" type="image/x-icon">
<link rel="stylesheet" href="{{ '/css/main.css' | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}">

<style>
/*
  Fallback for no-JS: !important ensures Rouge table rows can't
  bleed through even if inline style="" attrs aren't stripped.
  theme.js strips them at runtime for a cleaner result.
*/
.highlight tr, .highlight td, .highlight th,
.highlight table, .highlight thead, .highlight tbody {
  background: #f2f1ec !important;
  border: none !important;
  padding: 0 !important;
}
[data-theme="dark"] .highlight tr,
[data-theme="dark"] .highlight td,
[data-theme="dark"] .highlight th,
[data-theme="dark"] .highlight table,
[data-theme="dark"] .highlight thead,
[data-theme="dark"] .highlight tbody { background: #2b2a26 !important; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .highlight tr,
  :root:not([data-theme="light"]) .highlight td,
  :root:not([data-theme="light"]) .highlight th,
  :root:not([data-theme="light"]) .highlight table,
  :root:not([data-theme="light"]) .highlight thead,
  :root:not([data-theme="light"]) .highlight tbody { background: #2b2a26 !important; }
}
</style>

<!-- Restore saved theme before first paint -->
<script>
  (function(){
    var t = localStorage.getItem('theme');
    if (t === 'dark')  document.documentElement.setAttribute('data-theme', 'dark');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>

{% if site.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
